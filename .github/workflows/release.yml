name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build binaries
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build binaries
        run: bun run build:binary:all

      - name: Share macOS binaries with the app job
        uses: actions/upload-artifact@v4
        with:
          name: darwin-binaries
          path: dist/agenthands-darwin-*
          retention-days: 1

      - name: Share Linux binaries with the Docker job
        uses: actions/upload-artifact@v4
        with:
          name: linux-binaries
          path: dist/agenthands-linux-*
          retention-days: 1

      - name: Release notes from CHANGELOG
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > release-notes.md
          test -s release-notes.md || { echo "CHANGELOG.md has no section for $version"; exit 1; }

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          generate_release_notes: true
          files: |
            dist/agenthands-*
            scripts/install.sh

  docker:
    name: Build Docker image
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Linux binaries
        uses: actions/download-artifact@v4
        with:
          name: linux-binaries
          path: dist

      - name: Docker build context
        run: |
          mkdir -p dist/docker
          cp dist/agenthands-linux-x64 dist/docker/agenthands-amd64
          cp dist/agenthands-linux-arm64 dist/docker/agenthands-arm64
          ls -la dist/docker

      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=dry-run,enable=${{ !startsWith(github.ref, 'refs/tags/v') }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Smoke-test the amd64 image
        run: |
          docker buildx build --load --platform linux/amd64 --target release -f Dockerfile -t agenthands:smoke dist/docker
          docker run --rm agenthands:smoke agenthands --version
          docker run -d --name ah -p 8429:8429 agenthands:smoke
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8429/api/health && break; sleep 1; done
          curl -fsS http://127.0.0.1:8429/api/health | grep -q '"app":"agenthands"'
          docker rm -f ah

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: dist/docker
          file: Dockerfile
          target: release
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  desktop:
    name: Build macOS app
    needs: release
    runs-on: macos-latest
    timeout-minutes: 40
    env:
      AGENTHANDS_UPDATER_PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Download macOS binaries
        uses: actions/download-artifact@v4
        with:
          name: darwin-binaries
          path: dist

      - name: Make binaries executable
        run: chmod +x dist/agenthands-darwin-* && file dist/agenthands-darwin-*

      - name: Build app (arm64)
        run: bun scripts/build-desktop.ts --skip-binary --target aarch64-apple-darwin --archive

      - name: Build app (x64)
        run: bun scripts/build-desktop.ts --skip-binary --target x86_64-apple-darwin --archive

      - name: Check app bundles
        run: |
          for arch in aarch64 x86_64; do
            app="desktop/src-tauri/target/${arch}-apple-darwin/release/bundle/macos/Open Agent Hands.app"
            codesign --verify --deep --strict "$app"
            file "$app/Contents/MacOS/agenthands" "$app/Contents/MacOS/agenthands-desktop"
          done
          ls -la dist/OpenAgentHands-darwin-*.app.tar.gz*

      - name: Update manifest
        if: env.AGENTHANDS_UPDATER_PUBKEY != '' && env.TAURI_SIGNING_PRIVATE_KEY != ''
        run: bun scripts/updater-manifest.ts && cat dist/latest.json

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/OpenAgentHands-darwin-*.app.tar.gz
            dist/OpenAgentHands-darwin-*.app.tar.gz.sig
            dist/latest.json

      - name: Keep app archives (dry run)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: |
            dist/OpenAgentHands-darwin-*.app.tar.gz
            dist/OpenAgentHands-darwin-*.app.tar.gz.sig
            dist/latest.json
          retention-days: 3
