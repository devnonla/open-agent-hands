name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build binaries
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build binaries
        run: bun run build:binary:all

      - name: Share macOS binaries with the app job
        uses: actions/upload-artifact@v4
        with:
          name: darwin-binaries
          path: dist/agenthands-darwin-*
          retention-days: 1

      - name: Release notes from CHANGELOG
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > release-notes.md
          test -s release-notes.md || { echo "CHANGELOG.md has no section for $version"; exit 1; }

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          generate_release_notes: true
          files: |
            dist/agenthands-*
            scripts/install.sh

  desktop:
    name: Build macOS app
    needs: release
    runs-on: macos-latest
    timeout-minutes: 40
    env:
      AGENTHANDS_UPDATER_PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Download macOS binaries
        uses: actions/download-artifact@v4
        with:
          name: darwin-binaries
          path: dist

      - name: Make binaries executable
        run: chmod +x dist/agenthands-darwin-* && file dist/agenthands-darwin-*

      - name: Build app (arm64)
        run: bun scripts/build-desktop.ts --skip-binary --target aarch64-apple-darwin --archive

      - name: Build app (x64)
        run: bun scripts/build-desktop.ts --skip-binary --target x86_64-apple-darwin --archive

      - name: Check app bundles
        run: |
          for arch in aarch64 x86_64; do
            app="desktop/src-tauri/target/${arch}-apple-darwin/release/bundle/macos/Open Agent Hands.app"
            codesign --verify --deep --strict "$app"
            file "$app/Contents/MacOS/agenthands" "$app/Contents/MacOS/agenthands-desktop"
          done
          ls -la dist/OpenAgentHands-darwin-*.app.tar.gz*

      - name: Update manifest
        if: env.AGENTHANDS_UPDATER_PUBKEY != '' && env.TAURI_SIGNING_PRIVATE_KEY != ''
        run: bun scripts/updater-manifest.ts && cat dist/latest.json

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/OpenAgentHands-darwin-*.app.tar.gz
            dist/OpenAgentHands-darwin-*.app.tar.gz.sig
            dist/latest.json

      - name: Keep app archives (dry run)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: |
            dist/OpenAgentHands-darwin-*.app.tar.gz
            dist/OpenAgentHands-darwin-*.app.tar.gz.sig
            dist/latest.json
          retention-days: 3
