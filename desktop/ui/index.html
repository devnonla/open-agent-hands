<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Open Agent Hands</title>
    <style>
      :root {
        --bg: #faf9f7;
        --fg: #1a1815;
        --muted: #6f6a63;
        --error: #c2410c;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #161513;
          --fg: #f3f1ee;
          --muted: #9a948c;
          --error: #fb923c;
        }
      }
      html,
      body {
        height: 100%;
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        -webkit-user-select: none;
        user-select: none;
      }
      main {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        padding: 0 24px;
        text-align: center;
      }
      img {
        width: 72px;
        height: 72px;
      }
      h1 {
        margin: 0;
        font-size: 18px;
        font-weight: 600;
      }
      p {
        margin: 0;
        max-width: 420px;
        color: var(--muted);
      }
      p.error {
        color: var(--error);
      }
      .dots::after {
        content: "";
        animation: dots 1.2s steps(4, end) infinite;
      }
      @keyframes dots {
        0% { content: ""; }
        25% { content: "."; }
        50% { content: ".."; }
        75% { content: "..."; }
      }
    </style>
  </head>
  <body>
    <main>
      <img src="logo.svg" alt="" />
      <h1>Open Agent Hands</h1>
      <p id="status" class="dots">Starting the local server</p>
    </main>
    <script>
      window.setStatus = (kind, text) => {
        const el = document.getElementById("status");
        el.textContent = text;
        el.className = kind === "error" ? "error" : "dots";
      };
    </script>
  </body>
</html>
